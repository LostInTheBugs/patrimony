<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  :root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2430;--border:#232b36;--text:#e6edf3;--muted:#8b949e;--gold:#e3b341}
  *{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,sans-serif}
  body{width:350px;background:var(--bg);color:var(--text);font-size:13px;padding:12px}
  header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  header img{width:26px;height:26px;border-radius:6px}
  header b{color:var(--gold);letter-spacing:.5px}
  header span{margin-left:auto;color:var(--muted);cursor:pointer}
  label{display:block;color:var(--muted);font-size:11px;margin:8px 0 3px}
  select,input{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:13px}
  .row{display:flex;gap:8px}.row>div{flex:1}
  .note{color:var(--muted);font-size:11.5px;margin-top:6px;line-height:1.45}
  button{width:100%;margin-top:12px;background:var(--gold);color:#1a1300;border:0;border-radius:9px;padding:9px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .ok{color:#3fb950;font-size:12px;margin-top:8px}.err{color:#f85149;font-size:12px;margin-top:8px}
  .sep{border-top:1px solid var(--border);margin:12px 0 4px}
  .map{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px solid #1a212b;font-size:12px}
  .map .mono{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
  .map b{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .map .st{margin-left:auto;font-size:10.5px;color:var(--muted);white-space:nowrap}
  .map .st.ok{color:#3fb950}.map .st.err{color:#e6a23c}
  .map button{all:unset;cursor:pointer;color:#3fb950;font-size:13px;padding:0 2px}
</style>
</head>
<body>
  <header>
    <img src="icons/icon-48.png" alt="">
    <b>PATRIMONY CAPTURE</b>
    <span id="cfgLink" title="Options">⚙️</span>
  </header>
  <div id="noCfg" class="note" style="display:none">⚠️ Configurez d'abord l'URL de votre instance et votre jeton API (Paramètres → Accès API).</div>
  <div id="form" style="display:none">
    <label id="lblAcc">Actif</label><select id="pAcc"></select>
    <div class="row">
      <div><label id="lblAmt">Montant (€)</label><input id="pAmt" inputmode="decimal"></div>
      <div><label id="lblDate">Date</label><input id="pDate" type="date"></div>
    </div>
    <label id="lblNote">Note</label><input id="pNote" maxlength="200">
    <button id="pSave">📥 Enregistrer la valorisation</button>
    <div class="note" id="pHint"></div>
    <div id="pStatus"></div>
    <div class="sep"></div>
    <div id="mapsHead" class="note" style="display:none;margin-top:8px;font-weight:700;color:var(--text)">📡 Mappings auto</div>
    <div id="mapsWrap"></div>
  </div>
<script src="popup.js"></script>
</body>
</html>
